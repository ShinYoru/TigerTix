<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <radialGradient id="theaterSpotlight" cx="65%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="leatherGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="50%" stop-color="#1a202c"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="blueAtmosphere" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.85"/>
    </linearGradient>
    <pattern id="quiltedPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0,20 L20,0 L40,20 L20,40 Z" fill="none" stroke="#2b3340" stroke-width="1.2"/>
      <circle cx="20" cy="20" r="1.5" fill="#1e2430"/>
    </pattern>
    <filter id="ambientGlow">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Dark Theater Base -->
  <rect width="1600" height="900" fill="#090d16"/>
  <rect width="1600" height="900" fill="url(#theaterSpotlight)"/>

  <!-- Row of Luxury Motorized Recliners (Perspectival row like photo) -->
  <g opacity="0.95">
    <!-- Far Back Row 3 (Dim silhouette) -->
    <g transform="translate(600, 100) scale(0.65)" opacity="0.35">
      <rect x="0" y="0" width="180" height="240" rx="20" fill="#151a24"/>
      <rect x="220" y="0" width="180" height="240" rx="20" fill="#151a24"/>
      <rect x="440" y="0" width="180" height="240" rx="20" fill="#151a24"/>
      <rect x="660" y="0" width="180" height="240" rx="20" fill="#151a24"/>
    </g>

    <!-- Mid Row 2 -->
    <g transform="translate(420, 160) scale(0.85)" opacity="0.6">
      <!-- Seat 1 -->
      <rect x="0" y="0" width="220" height="320" rx="24" fill="url(#leatherGrad)" stroke="#2d3748" stroke-width="2"/>
      <rect x="20" y="40" width="180" height="240" rx="16" fill="url(#quiltedPattern)"/>
      <!-- Armrest table with ambient LED light ring -->
      <circle cx="230" cy="180" r="14" fill="#0284c7" opacity="0.8" filter="url(#ambientGlow)"/>

      <!-- Seat 2 -->
      <rect x="260" y="0" width="220" height="320" rx="24" fill="url(#leatherGrad)" stroke="#2d3748" stroke-width="2"/>
      <rect x="280" y="40" width="180" height="240" rx="16" fill="url(#quiltedPattern)"/>
      <circle cx="490" cy="180" r="14" fill="#0284c7" opacity="0.8" filter="url(#ambientGlow)"/>

      <!-- Seat 3 -->
      <rect x="520" y="0" width="220" height="320" rx="24" fill="url(#leatherGrad)" stroke="#2d3748" stroke-width="2"/>
      <rect x="540" y="40" width="180" height="240" rx="16" fill="url(#quiltedPattern)"/>
      <circle cx="750" cy="180" r="14" fill="#0284c7" opacity="0.8" filter="url(#ambientGlow)"/>
    </g>

    <!-- Foreground Row 1 (Large, sharp, prominent leather VIP recliners) -->
    <!-- Seat Left 1 -->
    <g transform="translate(-100, 140)">
      <rect x="0" y="0" width="340" height="580" rx="36" fill="url(#leatherGrad)" stroke="#334155" stroke-width="2.5"/>
      <rect x="35" y="80" width="270" height="420" rx="24" fill="url(#quiltedPattern)"/>
      <!-- Motorized controls indicator -->
      <circle cx="345" cy="360" r="16" fill="#0284c7" filter="url(#ambientGlow)" opacity="0.9"/>
      <circle cx="345" cy="360" r="8" fill="#38bdf8"/>
    </g>

    <!-- Seat Center-Left 2 -->
    <g transform="translate(290, 100)">
      <rect x="0" y="0" width="350" height="620" rx="36" fill="url(#leatherGrad)" stroke="#334155" stroke-width="2.5"/>
      <!-- Headrest -->
      <rect x="40" y="30" width="270" height="110" rx="20" fill="#1e2430" stroke="#334155" stroke-width="1.5"/>
      <!-- Diamond-quilted Backrest -->
      <rect x="40" y="160" width="270" height="400" rx="24" fill="url(#quiltedPattern)"/>
      <!-- Swivel table -->
      <rect x="350" y="320" width="90" height="35" rx="10" fill="#111827" stroke="#374151" stroke-width="2"/>
      <circle cx="395" cy="380" r="16" fill="#0284c7" filter="url(#ambientGlow)" opacity="0.85"/>
      <circle cx="395" cy="380" r="8" fill="#38bdf8"/>
    </g>

    <!-- Seat Center-Right 3 -->
    <g transform="translate(690, 60)">
      <rect x="0" y="0" width="360" height="660" rx="36" fill="url(#leatherGrad)" stroke="#334155" stroke-width="2.5"/>
      <rect x="45" y="30" width="270" height="110" rx="20" fill="#1e2430" stroke="#334155" stroke-width="1.5"/>
      <rect x="45" y="160" width="270" height="420" rx="24" fill="url(#quiltedPattern)"/>
      <!-- Swivel table -->
      <rect x="360" y="300" width="95" height="38" rx="10" fill="#111827" stroke="#374151" stroke-width="2"/>
      <circle cx="405" cy="360" r="16" fill="#0284c7" filter="url(#ambientGlow)" opacity="0.85"/>
      <circle cx="405" cy="360" r="8" fill="#38bdf8"/>
    </g>

    <!-- Seat Right 4 -->
    <g transform="translate(1100, 20)">
      <rect x="0" y="0" width="360" height="700" rx="36" fill="url(#leatherGrad)" stroke="#334155" stroke-width="2.5"/>
      <rect x="45" y="30" width="270" height="110" rx="20" fill="#1e2430" stroke="#334155" stroke-width="1.5"/>
      <rect x="45" y="160" width="270" height="460" rx="24" fill="url(#quiltedPattern)"/>
      <circle cx="370" cy="340" r="16" fill="#0284c7" filter="url(#ambientGlow)" opacity="0.85"/>
      <circle cx="370" cy="340" r="8" fill="#38bdf8"/>
    </g>
  </g>

  <!-- Ambient blue ceiling & sidewall theater glow -->
  <rect width="1600" height="900" fill="url(#blueAtmosphere)"/>

  <!-- Vignette and dark fade towards bottom for content overlay -->
  <linearGradient id="bottomFade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#000000" stop-opacity="0.1"/>
    <stop offset="55%" stop-color="#000000" stop-opacity="0.6"/>
    <stop offset="85%" stop-color="#0b0e14" stop-opacity="0.95"/>
    <stop offset="100%" stop-color="#0b0e14" stop-opacity="1"/>
  </linearGradient>
  <rect width="1600" height="900" fill="url(#bottomFade)"/>
</svg>