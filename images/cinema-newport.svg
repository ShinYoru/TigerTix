<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="npGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <linearGradient id="npLeather" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="70%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#npGlow)"/>

  <!-- Vertical Neon Blue Accent Lights on Side Wall -->
  <line x1="80" y1="180" x2="80" y2="400" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" opacity="0.85" filter="drop-shadow(0 0 8px #38bdf8)"/>
  <line x1="120" y1="200" x2="120" y2="420" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.85" filter="drop-shadow(0 0 8px #38bdf8)"/>
  <line x1="160" y1="220" x2="160" y2="440" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.85" filter="drop-shadow(0 0 8px #38bdf8)"/>

  <!-- Stepped Tier Carpet with Blue Guide Lights -->
  <line x1="40" y1="460" x2="760" y2="460" stroke="#0ea5e9" stroke-width="2.5" opacity="0.75"/>
  <line x1="120" y1="390" x2="760" y2="390" stroke="#0ea5e9" stroke-width="2" opacity="0.5"/>

  <!-- Plush Brown Leather Motorized VIP Seats -->
  <g fill="url(#npLeather)" stroke="#292524" stroke-width="2">
    <!-- Back Row -->
    <rect x="240" y="310" width="75" height="75" rx="10"/>
    <rect x="330" y="310" width="75" height="75" rx="10"/>
    <rect x="420" y="310" width="75" height="75" rx="10"/>
    <rect x="510" y="310" width="75" height="75" rx="10"/>
    <rect x="600" y="310" width="75" height="75" rx="10"/>

    <!-- Front Row Extra Wide Recliners -->
    <rect x="220" y="390" width="95" height="95" rx="14"/>
    <rect x="330" y="390" width="95" height="95" rx="14"/>
    <rect x="440" y="390" width="95" height="95" rx="14"/>
    <rect x="550" y="390" width="95" height="95" rx="14"/>
    <rect x="660" y="390" width="95" height="95" rx="14"/>
  </g>
</svg>