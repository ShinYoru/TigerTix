<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="moaGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#075985" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <linearGradient id="creamLeather" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#e2d6b5"/>
      <stop offset="100%" stop-color="#b5a682"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#moaGlow)"/>

  <!-- Geometric Acoustic Wall Paneling with Cyan Lighting -->
  <line x1="200" y1="120" x2="380" y2="300" stroke="#38bdf8" stroke-width="2.5" opacity="0.6"/>
  <line x1="260" y1="100" x2="440" y2="280" stroke="#38bdf8" stroke-width="2.5" opacity="0.6"/>
  <line x1="320" y1="80" x2="500" y2="260" stroke="#38bdf8" stroke-width="2.5" opacity="0.6"/>

  <!-- Stepped Beige/Cream Recliners (Matching SM MOA Photo) -->
  <!-- Upper Row -->
  <g fill="#cbd5e1" stroke="#64748b" stroke-width="2">
    <rect x="220" y="240" width="60" height="65" rx="10"/>
    <rect x="290" y="240" width="60" height="65" rx="10"/>
    <rect x="360" y="240" width="60" height="65" rx="10"/>
    <rect x="430" y="240" width="60" height="65" rx="10"/>
    <rect x="500" y="240" width="60" height="65" rx="10"/>
    <rect x="570" y="240" width="60" height="65" rx="10"/>
  </g>

  <!-- Mid Row -->
  <g fill="url(#creamLeather)" stroke="#78716c" stroke-width="2">
    <rect x="260" y="290" width="75" height="85" rx="12"/>
    <rect x="350" y="290" width="75" height="85" rx="12"/>
    <rect x="440" y="290" width="75" height="85" rx="12"/>
    <rect x="530" y="290" width="75" height="85" rx="12"/>
    <rect x="620" y="290" width="75" height="85" rx="12"/>
  </g>

  <!-- Foreground Row Plush Cream Recliners -->
  <g fill="url(#creamLeather)" stroke="#57534e" stroke-width="2.5">
    <rect x="380" y="340" width="95" height="110" rx="14"/>
    <rect x="495" y="340" width="95" height="110" rx="14"/>
    <rect x="610" y="340" width="95" height="110" rx="14"/>
    <!-- Drink Holder & Armrests -->
    <rect x="475" y="380" width="20" height="60" rx="4" fill="#44403c"/>
    <rect x="590" y="380" width="20" height="60" rx="4" fill="#44403c"/>
  </g>
</svg>