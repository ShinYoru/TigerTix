<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="dcGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#451a03" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#1c1917" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </radialGradient>
    <linearGradient id="leatherGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="60%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#dcGlow)"/>

  <!-- Tiered Wood Paneling / Carpeted Steps with Blue LED strips -->
  <line x1="120" y1="360" x2="260" y2="480" stroke="#38bdf8" stroke-width="4" opacity="0.85"/>
  <line x1="80" y1="390" x2="220" y2="510" stroke="#38bdf8" stroke-width="4" opacity="0.85"/>

  <!-- Back Row Recliners -->
  <g fill="#92400e" stroke="#451a03" stroke-width="2">
    <rect x="290" y="220" width="65" height="55" rx="8"/>
    <rect x="375" y="220" width="65" height="55" rx="8"/>
    <rect x="480" y="220" width="65" height="55" rx="8"/>
    <rect x="565" y="220" width="65" height="55" rx="8"/>
  </g>

  <!-- Middle Row Recliners -->
  <g fill="url(#leatherGrad)" stroke="#451a03" stroke-width="2">
    <rect x="280" y="285" width="75" height="65" rx="10"/>
    <circle cx="288" cy="275" r="4" fill="#fef08a"/> <!-- Personal reading light -->
    <rect x="375" y="285" width="75" height="65" rx="10"/>
    <rect x="495" y="285" width="75" height="65" rx="10"/>
    <rect x="590" y="285" width="75" height="65" rx="10"/>
  </g>

  <!-- Front Row Ultra-Plush Recliners -->
  <g fill="url(#leatherGrad)" stroke="#451a03" stroke-width="2.5">
    <!-- Recliner 1 -->
    <rect x="260" y="365" width="95" height="85" rx="12"/>
    <circle cx="270" cy="350" r="5" fill="#fef08a"/>
    <rect x="300" y="445" width="55" height="25" rx="6" fill="#78350f"/> <!-- Footrest -->

    <!-- Recliner 2 -->
    <rect x="380" y="365" width="95" height="85" rx="12"/>
    <circle cx="390" cy="350" r="5" fill="#fef08a"/>
    <rect x="420" y="445" width="55" height="25" rx="6" fill="#78350f"/>

    <!-- Recliner 3 -->
    <rect x="520" y="365" width="95" height="85" rx="12"/>
    <circle cx="530" cy="350" r="5" fill="#fef08a"/>
    <rect x="560" y="445" width="55" height="25" rx="6" fill="#78350f"/>

    <!-- Recliner 4 -->
    <rect x="640" y="365" width="95" height="85" rx="12"/>
    <circle cx="650" cy="350" r="5" fill="#fef08a"/>
    <rect x="680" y="445" width="55" height="25" rx="6" fill="#78350f"/>
  </g>
</svg>