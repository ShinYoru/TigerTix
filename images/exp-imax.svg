<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="imaxGlow" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#082f49" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="imaxLaser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#imaxGlow)"/>

  <!-- Ceiling Spots -->
  <g fill="#bae6fd" opacity="0.85">
    <circle cx="280" cy="40" r="4"/>
    <circle cx="340" cy="35" r="5"/>
    <circle cx="410" cy="38" r="4"/>
    <circle cx="470" cy="45" r="3.5"/>
    <circle cx="530" cy="55" r="3"/>
  </g>

  <!-- Massive IMAX Screen with Curved Perspective -->
  <path d="M 220,50 L 770,85 L 750,380 L 230,345 Z" fill="#051726" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Screen Glow / Media Content -->
  <path d="M 235,65 L 755,95 L 738,365 L 245,335 Z" fill="url(#imaxLaser)" opacity="0.9"/>

  <!-- IMAX LOGO ON SCREEN -->
  <text x="480" y="225" font-family="'Montserrat', sans-serif" font-weight="900" font-size="58" fill="#ffffff" letter-spacing="4" text-anchor="middle">IMAX</text>
  <text x="480" y="260" font-family="'Montserrat', sans-serif" font-weight="600" font-size="16" fill="#e0f2fe" letter-spacing="3" text-anchor="middle">WITH LASER</text>

  <!-- Stepped Stadium Seating (Sweeping Arc) -->
  <g fill="#0f172a" stroke="#1e293b" stroke-width="1.5">
    <!-- Row 1 -->
    <path d="M 50,390 Q 250,360 480,390 L 480,410 Q 250,380 50,410 Z"/>
    <!-- Row 2 -->
    <path d="M 40,420 Q 250,390 520,425 L 520,450 Q 250,415 40,450 Z"/>
    <!-- Row 3 -->
    <path d="M 30,460 Q 250,425 560,465 L 560,500 Q 250,455 30,500 Z"/>
  </g>
</svg>