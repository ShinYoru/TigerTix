<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="regGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#2a3b5c" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#111622" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </radialGradient>
    <linearGradient id="regScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#regGlow)"/>
  
  <!-- Back Wall Accent Lines -->
  <line x1="60" y1="210" x2="220" y2="210" stroke="#ef4444" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <line x1="80" y1="240" x2="210" y2="240" stroke="#ef4444" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  <line x1="50" y1="270" x2="190" y2="270" stroke="#ef4444" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  <line x1="90" y1="300" x2="170" y2="300" stroke="#ef4444" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <!-- Curved Screen -->
  <path d="M 240,110 Q 510,95 760,110 L 750,335 Q 505,355 245,335 Z" fill="url(#regScreen)" filter="drop-shadow(0 0 25px rgba(255,255,255,0.45))"/>
  
  <!-- Cinema Seating -->
  <!-- Back Row -->
  <g fill="#1a1c23" stroke="#252936" stroke-width="2">
    <rect x="70" y="340" width="45" height="40" rx="6"/>
    <rect x="125" y="340" width="45" height="40" rx="6"/>
    <rect x="180" y="340" width="45" height="40" rx="6"/>
    <rect x="235" y="340" width="45" height="40" rx="6"/>
    <rect x="290" y="340" width="45" height="40" rx="6"/>
    <rect x="345" y="340" width="45" height="40" rx="6"/>
    <rect x="400" y="340" width="45" height="40" rx="6"/>
    <rect x="455" y="340" width="45" height="40" rx="6"/>
  </g>

  <!-- Middle Row (Red Accents) -->
  <g fill="#dc2626" stroke="#991b1b" stroke-width="2">
    <rect x="80" y="380" width="52" height="48" rx="8"/>
    <rect x="140" y="380" width="52" height="48" rx="8"/>
    <rect x="200" y="380" width="52" height="48" rx="8"/>
    <rect x="260" y="380" width="52" height="48" rx="8"/>
    <rect x="340" y="380" width="52" height="48" rx="8"/>
    <rect x="400" y="380" width="52" height="48" rx="8"/>
    <rect x="460" y="380" width="52" height="48" rx="8"/>
    <rect x="520" y="380" width="52" height="48" rx="8"/>
  </g>

  <!-- Front Row (Plush Red) -->
  <g fill="#b91c1c" stroke="#7f1d1d" stroke-width="2">
    <rect x="100" y="430" width="62" height="58" rx="10"/>
    <rect x="175" y="430" width="62" height="58" rx="10"/>
    <rect x="270" y="430" width="62" height="58" rx="10"/>
    <rect x="345" y="430" width="62" height="58" rx="10"/>
    <rect x="420" y="430" width="62" height="58" rx="10"/>
    <rect x="495" y="430" width="62" height="58" rx="10"/>
  </g>
</svg>